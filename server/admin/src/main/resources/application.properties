spring.application.name=csi-admin
server.port=8180

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:3306/${DB_NAME:csi_c6}
spring.datasource.username=${DB_USER:csi_c6}
spring.datasource.password=${DB_PASSWORD:csi_c6_dev}

# Schema is managed by server/initdb/*.sql - keep JPA hands off
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 접근 비밀번호 (비어 있으면 인증 비활성 — 클라우드에선 환경변수 ADMIN_PASSWORD 필수)
admin.password=${ADMIN_PASSWORD:}

# 라이브 뷰가 Rx 4개분 진폭 배열을 실시간으로 내려보내므로 응답 압축이 필수다.
# 반복되는 숫자 텍스트라 gzip 효과가 크다(수 배).
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024
