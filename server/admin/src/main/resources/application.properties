spring.application.name=csi-admin
server.port=8180

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:3306/${DB_NAME:csi_c6}
spring.datasource.username=${DB_USER:csi_c6}
spring.datasource.password=${DB_PASSWORD:csi_c6_dev}

# Schema is managed by server/initdb/*.sql - keep JPA hands off
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 접근 비밀번호 (비어 있으면 인증 비활성 — 클라우드에선 환경변수 ADMIN_PASSWORD 필수)
admin.password=${ADMIN_PASSWORD:}
