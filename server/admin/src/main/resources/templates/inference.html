<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C6 CSI — 추론</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4" defer></script>
</head>
<body>
<nav>
  <a class="brand" href="/">C6 CSI</a>
  <a class="tab" href="/">대시보드</a>
  <a class="tab" href="/calibrations">보정</a>
  <a class="tab" href="/sessions">수집 세션</a>
  <a class="tab active" href="/inference">추론</a>
</nav>
<main>
  <h1 class="display">낙상 추론</h1>
  <p class="lead">RF 확률과 보정 임계값, 결손 품질, 에피소드 판정을 함께 표시합니다</p>

  <div class="cards">
    <div class="card"><div class="k">모드</div><div class="v"><span class="chip lg standby" id="modeChip">—</span></div></div>
    <div class="card"><div class="k">파이프라인 상태</div><div class="v"><span class="chip lg ok" id="healthChip">—</span></div></div>
    <div class="card"><div class="k">활성 보정</div><div class="v" id="calibration" style="font-size:22px">—</div></div>
    <div class="card featured"><div class="k">현재 확률 / 임계값</div><div class="v" id="score" style="font-size:22px">—</div></div>
  </div>

  <div class="panel">
    <h3>확률 추이 — 최근 60분</h3>
    <canvas id="chart" height="90"></canvas>
    <div class="hint" id="hint">아직 추론 결과가 없습니다.</div>
  </div>

  <div class="panel">
    <h3>에피소드</h3>
    <table>
      <thead><tr><th>시작</th><th>판정</th><th>최고 확률</th><th>판정 이유</th></tr></thead>
      <tbody id="episodes"><tr><td colspan="4">기록 없음</td></tr></tbody>
    </table>
  </div>
</main>
<script th:inline="none">
const MODE_CLASS = { STANDBY:'standby', CALIBRATION:'calibration', INFERENCE:'inference', CAPTURE:'capture' };
const MODE_LABEL = { STANDBY:'대기', CALIBRATION:'보정 중', INFERENCE:'추론 중', CAPTURE:'수집 중' };
const HEALTH_CLASS = { OK:'ok', STARTING:'standby', WARNING:'warning', DEGRADED:'degraded', ERROR:'error' };
const EP_CLASS = { CONFIRMED:'error', REJECTED:'standby', PENDING:'warning' };
const EP_LABEL = { CONFIRMED:'낙상 확정', REJECTED:'기각', PENDING:'판정 중' };
let chart = null;

async function refresh() {
  const [state, results, episodes] = await Promise.all([
    fetch('/api/system').then(r => r.json()),
    fetch('/api/inference?minutes=60').then(r => r.json()),
    fetch('/api/episodes?limit=100').then(r => r.json()),
  ]);

  const modeChip = document.getElementById('modeChip');
  modeChip.className = 'chip lg ' + (MODE_CLASS[state.mode] || 'standby') + (state.mode !== 'STANDBY' ? ' pulse' : '');
  modeChip.textContent = MODE_LABEL[state.mode] || state.mode;

  const healthChip = document.getElementById('healthChip');
  healthChip.className = 'chip lg ' + (HEALTH_CLASS[state.health] || 'standby');
  healthChip.textContent = state.health;

  document.getElementById('calibration').innerHTML = state.active_calibration_id
    ? `<a href="/calibrations" style="color:var(--accent); text-decoration:none">#${state.active_calibration_id}</a>` : '없음';

  if (results.length) {
    document.getElementById('hint').style.display = 'none';
    const last = results[results.length - 1];
    document.getElementById('score').textContent =
      (last.probability * 100).toFixed(1) + '% / ' + (last.threshold * 100).toFixed(1) + '%';

    const labels = results.map(x => new Date(x.ts * 1000).toLocaleTimeString('ko-KR', {hour12:false}));
    const probs = results.map(x => x.probability);
    const thrs = results.map(x => x.threshold);
    if (typeof Chart !== 'undefined') {
      if (!chart) {
        chart = new Chart(document.getElementById('chart'), {
          type: 'line',
          data: { labels,
            datasets: [
              { label: '낙상 확률', data: probs, borderColor: '#4f46e5',
                backgroundColor: 'rgba(79,70,229,.08)', fill: true, pointRadius: 0, borderWidth: 1.5, tension: .25 },
              { label: '임계값', data: thrs, borderColor: '#dc2626',
                borderDash: [5,4], pointRadius: 0, borderWidth: 1.2 },
            ]},
          options: {
            animation: false,
            plugins: { legend: { labels: { color: '#374151', font: { family: 'Inter' } } } },
            scales: {
              x: { ticks: { color: '#9ca3af', maxTicksLimit: 10 }, grid: { color: '#f3f4f6' } },
              y: { min: 0, max: 1, ticks: { color: '#374151' }, grid: { color: '#f3f4f6' } },
            },
          },
        });
      } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = probs;
        chart.data.datasets[1].data = thrs;
        chart.update('none');
      }
    }
  }

  document.getElementById('episodes').innerHTML = episodes.map(e =>
    `<tr><td>${new Date(e.start_ts * 1000).toLocaleString('ko-KR', {hour12:false})}</td>
     <td><span class="chip ${EP_CLASS[e.status] || 'standby'}">${EP_LABEL[e.status] || e.status}</span></td>
     <td>${(e.peak_probability * 100).toFixed(1)}%</td><td>${e.reason || '—'}</td></tr>`
  ).join('') || '<tr><td colspan="4">기록 없음</td></tr>';
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
